# Match sync every 2 hours (Vercel's free plan only allows one cron per day).
# Calls the same endpoint as the Vercel cron: syncs scores, settles finished
# challenges and rounds, opens automatic rounds and posts them to the channel.
#
# Needs ONE repository secret: CRON_SECRET (exactly the same value as
# CRON_SECRET in Vercel → Settings → Environment Variables).
# GitHub → repo → Settings → Secrets and variables → Actions → New repository secret.
name: Sync matches

on:
  schedule:
    - cron: "15 */2 * * *" # every 2 hours at :15 (UTC)
  workflow_dispatch: {} # "Run workflow" button for a manual sync

concurrency:
  group: sync-matches
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /api/sync-matches
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the CRON_SECRET repository secret (same value as in Vercel)."
            exit 1
          fi
          code=$(curl -sS -o result.json -w "%{http_code}" --max-time 280 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.gebetasoccer.com/api/sync-matches")
          echo "HTTP $code"
          head -c 3000 result.json; echo
          # 200 = all good, 207 = synced with some league errors (still fine)
          if [ "$code" != "200" ] && [ "$code" != "207" ]; then exit 1; fi
